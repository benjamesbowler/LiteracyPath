name: Refresh reviewed Linux visual baselines

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Baseline set to refresh
        required: true
        default: authenticated-missing
        type: choice
        options:
          - all
          - authenticated-missing
          - guided-reading-controls
          - ui-chrome
          - app-simplification
          - child-redesign

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install Supabase CLI
        if: inputs.scope != 'ui-chrome' && inputs.scope != 'child-redesign'
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}
      - name: Start and seed isolated audit database
        if: inputs.scope != 'ui-chrome' && inputs.scope != 'child-redesign'
        run: |
          supabase start --exclude realtime,storage,imgproxy,inbucket,meta,studio,edge-runtime,functions,analytics,vector
          supabase db reset --local --no-seed
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          source "$RUNNER_TEMP/supabase.env"
          audit_password="$(openssl rand -base64 24 | tr -d '\n')"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$audit_password"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "LP_AUDIT_SUPABASE_URL=$API_URL"
            echo "LP_AUDIT_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "LP_AUDIT_DATABASE_URL=$DB_URL"
            echo "LP_AUDIT_TEACHER_PASSWORD=$audit_password"
          } >> "$GITHUB_ENV"
      - name: Seed deterministic audit school
        if: inputs.scope != 'ui-chrome' && inputs.scope != 'child-redesign'
        run: npm run seed:audit-school
      - name: Refresh every reviewed Linux baseline
        if: inputs.scope == 'all'
        run: |
          npx playwright test \
            tests/release/el-assessment-completion-device-matrix.spec.js \
            tests/release/guided-reading-control-hierarchy.spec.js \
            tests/release/guided-reading-measure.spec.js \
            tests/release/key-route-visuals.spec.js \
            tests/release/sound-racer-tutorial.spec.js \
            tests/release/student-device-matrix.spec.js \
            tests/release/student-emphasis-budget.spec.js \
            tests/release/student-home-card-states.spec.js \
            tests/release/student-home-hierarchy.spec.js \
            tests/release/student-login-panel.spec.js \
            tests/release/student-login-recovery.spec.js \
            tests/release/student-rail-accessibility.spec.js \
            tests/release/teacher-roster-device-matrix.spec.js \
            --project=desktop --workers=1 --update-snapshots=all
          env -u LP_AUDIT_TEACHER_PASSWORD npx playwright test \
            tests/release/teacher-roster-device-matrix.spec.js \
            --project=desktop --workers=1 --update-snapshots=all
      - name: Refresh shared UI preview baselines
        if: inputs.scope == 'ui-chrome'
        run: |
          npx playwright test \
            tests/release/hollow-simple-flows.spec.js \
            tests/release/guided-reading-control-hierarchy.spec.js \
            tests/release/key-route-visuals.spec.js \
            tests/release/student-device-matrix.spec.js \
            tests/release/student-emphasis-budget.spec.js \
            tests/release/student-home-card-states.spec.js \
            tests/release/student-home-hierarchy.spec.js \
            tests/release/student-login-panel.spec.js \
            tests/release/student-login-recovery.spec.js \
            tests/release/student-rail-accessibility.spec.js \
            tests/release/teacher-roster-device-matrix.spec.js \
            --project=desktop --workers=1 --update-snapshots=all
      - name: Verify child redesign and refresh its Linux baselines
        if: inputs.scope == 'child-redesign'
        run: |
          npx playwright test \
            tests/release/student-device-matrix.spec.js \
            tests/release/student-emphasis-budget.spec.js \
            tests/release/child-surface-rules.spec.js \
            tests/release/home-open-gallery.spec.js \
            tests/release/books-hollow-gallery-layout.spec.js \
            tests/release/hollow-simple-flows.spec.js \
            tests/release/student-home-card-states.spec.js \
            tests/release/student-home-hierarchy.spec.js \
            tests/release/student-rail-accessibility.spec.js \
            tests/release/learning-pace.spec.js \
            --project=desktop --workers=2 --update-snapshots=all
          npx playwright test \
            tests/release/student-device-matrix.spec.js \
            tests/release/student-emphasis-budget.spec.js \
            tests/release/home-open-gallery.spec.js \
            tests/release/books-hollow-gallery-layout.spec.js \
            tests/release/learning-pace.spec.js \
            --project=desktop --workers=2
      - name: Verify integrated simplification flows and affected Linux baselines
        if: inputs.scope == 'app-simplification'
        run: |
          npx playwright test \
            tests/release/simplified-entry-flows.spec.js \
            tests/release/student-hub-simplification.spec.js \
            tests/release/activity-control-clarity.spec.js \
            tests/release/teacher-workflow-focus.spec.js \
            tests/release/teacher-cycle-context.spec.js \
            tests/release/worksheet-cycle-context.spec.js \
            tests/release/student-session-controls.spec.js \
            tests/release/teacher-review-fixes.spec.js \
            tests/release/teacher-action-layout.spec.js \
            tests/release/teacher-roster-device-matrix.spec.js \
            --project=desktop --workers=1 --update-snapshots=all
          npx playwright test \
            tests/release/student-device-matrix.spec.js \
            tests/release/student-emphasis-budget.spec.js \
            --grep 'adventure-map|phonics|sound-seekers|story-quests|truncated' \
            --project=desktop --workers=1 --update-snapshots=all
          env -u LP_AUDIT_TEACHER_PASSWORD npx playwright test \
            tests/release/teacher-roster-device-matrix.spec.js \
            --project=desktop --workers=1 --update-snapshots=all
          npx playwright test \
            tests/release/key-route-visuals.spec.js \
            --grep 'Sound Seekers|Learn|sound-seekers|story-quests' \
            --project=desktop --workers=1 --update-snapshots=all
      - name: Refresh and verify child reader Linux controls
        if: inputs.scope == 'guided-reading-controls'
        run: |
          npx playwright test \
            tests/release/guided-reading-control-hierarchy.spec.js \
            tests/release/guided-reading-auto-open.spec.js \
            --project=desktop --workers=1 --update-snapshots=all
          npx playwright test \
            tests/release/guided-reading-control-hierarchy.spec.js \
            tests/release/guided-reading-auto-open.spec.js \
            --project=desktop --workers=1
      - name: Refresh missing authenticated Linux baselines
        if: inputs.scope == 'authenticated-missing'
        run: |
          npx playwright test \
            tests/release/el-assessment-completion-device-matrix.spec.js \
            tests/release/teacher-roster-device-matrix.spec.js \
            --project=desktop --workers=1 --update-snapshots=all
      - name: Upload approved Linux baselines
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: reviewed-linux-visual-baselines-${{ github.sha }}
          path: tests/release/**/*-snapshots/linux/*.png
          if-no-files-found: error
          retention-days: 3
      - name: Upload visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-visual-failure-evidence-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            tests/release/**/*-snapshots/linux/*.png
          if-no-files-found: warn
          retention-days: 3
      - name: Stop local Supabase
        if: always() && inputs.scope != 'ui-chrome' && inputs.scope != 'child-redesign'
        run: supabase stop --no-backup
