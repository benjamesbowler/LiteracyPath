# CI — the gate that was missing.
#
# Before this file existed, all six quest gates were opt-in muscle memory and
# Vercel deployed whatever was pushed, green or not. The 2026-07-14 audit's
# closing line named the consequence: every silent screen-level break lived
# "where the tests stop and the CI doesn't exist." A commit that broke
# check:quest shipped to production green.
#
# Three required jobs:
#   checks   — lint, the full unit suite (450 tests incl. the full-trail
#              simulation), and every node-only quest gate. Fast, no browser.
#   visual   — build + the Playwright gates (route renders receive pixel-level
#              nonblank checks; shots fails on console errors / 404s / stuck
#              loads since 2026-07-15). Screenshots upload as artifacts so a
#              red run shows you the actual pixels.
#   release-gate — the canonical whole-product manifest, against a freshly
#              migrated and deterministically seeded local Supabase stack.
#
# Branch protection: make ALL THREE jobs required, and point Vercel at the same
# branch so nothing deploys around them.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Unit tests (includes the full-trail simulation)
        run: npm test
      - name: Quest content gate
        run: npm run check:quest
      - name: Content rubric gate (no three-cueing — tools/rubrics P-E4)
        run: npm run check:content-rubric
      - name: Narrative-content admission and evidence gate
        run: npm run check:story-content-policy
      - name: Guided Reading Story Bible, level and exact-audio gate
        run: npm run check:guided-reading-story-bible
      - name: Guided Reading illustration alignment gate
        run: npm run check:guided-reading-visual-alignment
      - name: Guided Reading evidence-question gate
        run: npm run check:validate:guided-reading-questions
      - name: Quest chapter-one release gate
        run: npm run check:quest-chapter-one
      - name: Quest 3D asset gate
        run: npm run check:quest-3d
      - name: Quest art gate
        run: npm run check:quest-art
      - name: Quest music gate
        run: npm run check:quest-music

  visual:
    runs-on: ubuntu-latest
    # The full legacy-camera evidence pass now takes about ten minutes on a
    # hosted software renderer, followed by fifteen settled screenshots and the
    # MIDI permission matrix. Keep enough headroom for a slow checkout/runner so
    # a healthy visual audit can report its real result.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Route visual gate (pixel-level nonblank checks)
        run: npm run check:quest-route-visual
      - name: Slice camera gate
        run: npm run check:quest-slice-camera
      - name: Screenshot gate (fails on console errors / 404s / stuck loads)
        run: A11Y_ENFORCE=1 npm run shots
      - name: SoundKeys MIDI device and permission gate
        run: npm run check:soundkeys-midi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quest-shots
          path: |
            .artifacts/quest/shots/
            docs/previews/shots/
            docs/previews/slice/
          if-no-files-found: ignore
          retention-days: 14

  release-gate:
    runs-on: ubuntu-24.04
    # The canonical gate currently runs 104 checks sequentially. It takes about
    # 27 minutes on a warm development machine, while a fresh hosted runner also
    # has to install browsers, start Supabase, migrate, and seed the audit school.
    # Forty-five minutes was terminating healthy runs before they could report
    # their real result.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}
      - name: Install PostgreSQL 17 recovery tools
        run: |
          sudo apt-get install --yes curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            'Suites: noble-pgdg' \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -F "17."
      - name: Start fresh local Supabase
        run: |
          supabase start --exclude realtime,storage,imgproxy,inbucket,meta,studio,edge-runtime,functions,analytics,vector
          supabase db reset --local --no-seed
      - name: Export local audit environment
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          source "$RUNNER_TEMP/supabase.env"
          audit_password="$(openssl rand -base64 24 | tr -d '\n')"
          recovery_database="literacypath_recovery-drill"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "create database \"$recovery_database\""
          recovery_target_url="${DB_URL%/*}/$recovery_database"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$audit_password"
          echo "::add-mask::$recovery_target_url"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "LP_AUDIT_SUPABASE_URL=$API_URL"
            echo "LP_AUDIT_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "LP_AUDIT_DATABASE_URL=$DB_URL"
            echo "LP_AUDIT_TEACHER_PASSWORD=$audit_password"
            echo "LP_RECOVERY_SOURCE_DATABASE_URL=$DB_URL"
            echo "LP_RECOVERY_TARGET_DATABASE_URL=$recovery_target_url"
            echo "LP_RECOVERY_DRILL_TARGET_MARKER=$recovery_database"
            echo "LP_RECOVERY_DRILL_CONFIRM=RESTORE:$recovery_database"
          } >> "$GITHUB_ENV"
      - name: Seed deterministic audit school
        run: npm run seed:audit-school
      - name: Prepare restricted private source-map vault
        run: echo "LP_PRIVATE_SOURCE_MAP_KEEP_ROOT=$RUNNER_TEMP/private-source-maps" >> "$GITHUB_ENV"
      - name: Run canonical whole-product release gate
        id: whole-product
        continue-on-error: true
        run: npm run check:release
      - name: Upload release manifest and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: |
            .artifacts/release/manifest.json
            .artifacts/release/
            docs/release/artifacts/recovery/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload private source maps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-source-maps-${{ github.sha }}
          path: ${{ runner.temp }}/private-source-maps/
          if-no-files-found: error
          retention-days: 30
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
      - name: Enforce whole-product result
        if: steps.whole-product.outcome != 'success'
        run: exit 1
