# CI — the gate that was missing.
#
# Before this file existed, all six quest gates were opt-in muscle memory and
# Vercel deployed whatever was pushed, green or not. The 2026-07-14 audit's
# closing line named the consequence: every silent screen-level break lived
# "where the tests stop and the CI doesn't exist." A commit that broke
# check:quest shipped to production green.
#
# Two jobs:
#   checks   — lint, the full unit suite (450 tests incl. the full-trail
#              simulation), and every node-only quest gate. Fast, no browser.
#   visual   — build + the Playwright gates (route renders receive pixel-level
#              nonblank checks; shots fails on console errors / 404s / stuck
#              loads since 2026-07-15). Screenshots upload as artifacts so a
#              red run shows you the actual pixels.
#
# Branch protection: make BOTH jobs required, and point Vercel at the same
# branch so nothing deploys around them.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests (includes the full-trail simulation)
        run: npm test
      - name: Quest content gate
        run: npm run check:quest
      - name: Quest chapter-one release gate
        run: npm run check:quest-chapter-one
      - name: Quest 3D asset gate
        run: npm run check:quest-3d
      - name: Quest art gate
        run: npm run check:quest-art
      - name: Quest music gate
        run: npm run check:quest-music

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Route visual gate (pixel-level nonblank checks)
        run: npm run check:quest-route-visual
      - name: Slice camera gate
        run: npm run check:quest-slice-camera
      - name: Screenshot gate (fails on console errors / 404s / stuck loads)
        run: npm run shots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quest-shots
          path: |
            docs/previews/shots/
            docs/previews/slice/
          if-no-files-found: ignore
          retention-days: 14
