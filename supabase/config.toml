# Local/CI configuration for deterministic release auditing.
# The audit school is intentionally excluded from automatic reset seeding and
# must be applied through `npm run seed:audit-school`.
project_id = "literacy-path-audit"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
# An unverified address can no longer be approved into teacher access
# (20260807110000_teacher_email_confirmation.sql). With manual approval kept
# rather than domain-anchored auto-approval, the administrator is judging a
# person by their email address, so the address has to be real.
#
# THIS FILE IS LOCAL/CI ONLY — see the header comment. The hosted project's auth
# settings do not live in this repository and must be changed there too:
# Authentication -> Sign In / Providers -> Email -> Confirm email. Until that is
# done, hosted signups still auto-confirm and the database rule never bites.
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600
