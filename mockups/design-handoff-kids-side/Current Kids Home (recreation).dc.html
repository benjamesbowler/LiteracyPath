<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #FBF4EA; }
  a { color: #2E4B3E; }
  a:hover { color: #3E776B; }
</style>
</helmet>

<div style="width: 1194px; min-height: 834px; display: flex; background: #FBF4EA; color: #182620; font-family: Nunito, system-ui, sans-serif;">

  <aside style="width: 232px; flex: 0 0 232px; background: #3E776B; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 30px 14px 18px;">
    <span style="width: 92px; height: 92px; border-radius: 50%; background: #fff; display: grid; place-items: center; overflow: hidden; box-shadow: 0 0 0 5px rgba(255,255,255,0.45);">
      <img src="assets/companions/pip.webp" alt="" style="width: 78px; height: 78px; object-fit: contain;" />
    </span>
    <span style="margin-top: 12px; font-weight: 800; font-size: 17px;">Aaron</span>
    <button type="button" style="margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; background: #fff; color: #182620; border: 0; border-radius: 999px; padding: 5px 14px 5px 9px; font: 800 13.5px Nunito, sans-serif; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,0.08); min-height: 44px;">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#F5A623" stroke="#101820" stroke-width="2"></circle><circle cx="12" cy="12" r="7" fill="#FFC93C" stroke="#B8741A" stroke-width="1.2"></circle><path d="M12 7.6l1.25 2.53 2.8.4-2.03 1.98.48 2.79L12 13.98l-2.5 1.32.48-2.79-2.03-1.98 2.8-.4L12 7.6z" fill="#B8741A"></path></svg>
      569
    </button>

    <nav aria-label="Places to play" style="width: 100%; margin-top: 26px; display: flex; flex-direction: column; gap: 4px;">
      <sc-for list="{{ rail }}" as="item" hint-placeholder-count="8">
        <span style="display: grid; grid-template-columns: minmax(0,1fr) 44px; align-items: center; gap: 3px;">
          <button type="button" style="display: flex; align-items: center; gap: 8px; width: 100%; background: {{ item.bg }}; border: 0; color: #fff; font: 700 15px Nunito, sans-serif; text-align: left; padding: 10px; min-height: 48px; border-radius: 14px; cursor: pointer;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 20px; height: 20px; flex: 0 0 20px;"><path d="{{ item.d }}"></path></svg>
            <span>{{ item.label }}</span>
          </button>
          <button type="button" aria-label="Hear" style="display: grid; width: 44px; height: 44px; place-items: center; padding: 0; border: 0; border-radius: 12px; background: none; color: rgba(255,255,255,0.86); cursor: pointer;">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width: 19px; height: 19px;"><path d="M5 10v4h3l4 3V7l-4 3H5Z" fill="currentColor"></path><path d="M15.5 9.5a4 4 0 0 1 0 5M18 7a8 8 0 0 1 0 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
          </button>
        </span>
      </sc-for>
    </nav>
    <span style="flex: 1;"></span>
  </aside>

  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
    <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 26px 8px;">
      <span style="grid-column: 2; display: inline-flex; align-items: center; gap: 8px;">
        <img src="assets/brand/mark.webp" alt="" style="width: 44px; height: 44px; object-fit: contain;" />
        <span style="display: grid; gap: 1px; color: #3E776B; font-size: 14px; font-weight: 900; line-height: 1; text-align: left;">
          <strong style="color: #2E4B3E; font-size: 15px;">Little Literacy</strong>
          <span style="color: #B44322;">Guides</span>
        </span>
      </span>
      <div style="grid-column: 3; justify-self: end; display: flex; gap: 10px;">
        <button type="button" style="background: #fff; border: 1.5px solid #E9E1D4; border-radius: 12px; padding: 9px 15px; min-height: 44px; font: 800 14px Nunito, sans-serif; color: #182620; display: inline-flex; gap: 7px; align-items: center; cursor: pointer;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" style="width: 16px; height: 16px;"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20c1.5-3.5 4.2-5 7.5-5s6 1.5 7.5 5"></path></svg>
          Grown-ups
        </button>
      </div>
    </div>

    <section aria-label="Learning areas" style="background: #fff; border-radius: 26px; width: calc(100% - 40px); margin: 6px auto 20px; padding: 30px 34px 36px; flex: 1; box-shadow: 0 1px 3px rgba(30,40,30,0.05); box-sizing: border-box;">
      <div>
        <h1 style="margin: 0; font-size: 40px; line-height: 1.05; font-weight: 800;">Hello, Aaron!</h1>
        <p style="margin: 6px 0 0; font-size: 16px; color: #4A5A52; font-weight: 600;">What shall we play today?</p>
      </div>

      <section style="margin-top: 20px; padding: 14px 16px 15px; border: 1.5px solid #E8D4BB; border-radius: 18px; background: #FCF6EC;">
        <div style="display: flex; align-items: end; justify-content: space-between; gap: 18px;">
          <div style="display: grid; gap: 1px;">
            <span style="color: #9F5B23; font-size: 10.5px; font-weight: 900; letter-spacing: 0.09em; text-transform: uppercase;">Today</span>
            <h2 style="margin: 0; font-size: 18px; line-height: 1.2;">Your daily adventure</h2>
          </div>
          <strong style="color: #2E4B3E; font-size: 13px; white-space: nowrap;">1 of 3 complete</strong>
        </div>
        <div style="width: 100%; height: 7px; margin: 10px 0 11px; border-radius: 99px; overflow: hidden; background: #EADDCB;">
          <i style="display: block; height: 100%; width: 33.3%; background: #3E776B; border-radius: 99px;"></i>
        </div>
        <ol style="margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; list-style: none;">
          <li style="display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 1.5px solid transparent; border-radius: 12px; color: #2E4B3E;">
            <span style="width: 28px; height: 28px; flex: 0 0 28px; display: grid; place-items: center; border-radius: 50%; background: #3E776B; color: #fff; font-size: 12px; font-weight: 900;">✓</span>
            <span style="display: grid; gap: 1px;"><strong style="font-size: 13px;">Adventure Map</strong><small style="font-size: 11px; font-weight: 700;">Done</small></span>
          </li>
          <li style="display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 1.5px solid #9F5B23; border-radius: 12px; background: #fff; color: #182620;">
            <span style="width: 28px; height: 28px; flex: 0 0 28px; display: grid; place-items: center; border-radius: 50%; background: #9F5B23; color: #fff; font-size: 12px; font-weight: 900;">2</span>
            <span style="display: grid; gap: 1px;"><strong style="font-size: 13px;">Reading Library</strong><small style="font-size: 11px; font-weight: 700;">Up next</small></span>
          </li>
          <li style="display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 1.5px solid transparent; border-radius: 12px; color: #4A5A52;">
            <span style="width: 28px; height: 28px; flex: 0 0 28px; display: grid; place-items: center; border-radius: 50%; background: #EADDCB; font-size: 12px; font-weight: 900;">3</span>
            <span style="display: grid; gap: 1px;"><strong style="font-size: 13px;">Arcade</strong><small style="font-size: 11px; font-weight: 700;">Later</small></span>
          </li>
        </ol>
      </section>

      <div style="margin-top: 24px; display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); gap: 18px; align-items: stretch;">
        <section aria-label="Recommended next activity" style="display: flex; min-width: 0;">
          <button type="button" style="width: 100%; background: linear-gradient(135deg,#F3FAF4,#fff); border: 2px solid #3E776B; border-radius: 16px; padding: 11px 13px 12px; display: flex; flex-direction: column; align-items: stretch; text-align: left; font-family: inherit; color: inherit; cursor: pointer; box-shadow: 0 8px 24px rgba(46,75,62,0.1);">
            <span style="border-radius: 12px; height: 210px; overflow: hidden; position: relative; background: #BFE3D8;">
              <img src="assets/home/reading-library.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top;" />
            </span>
            <span style="margin-top: 12px; color: #9F5B23; font-size: 11px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase;">Recommended next</span>
            <h3 style="margin: 4px 0 0; font-size: 24px; font-weight: 800; text-align: left;">Reading Library</h3>
            <span style="min-height: 44px; margin-top: 10px; padding: 9px 12px; border-radius: 10px; background: #2E4B3E; color: #fff; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" style="width: 17px; height: 17px;"><path d="M7 5.5v13l11-6.5-11-6.5Z"></path></svg>
              Read today's book
            </span>
            <span style="margin-top: 3px; color: #4A5A52; font-size: 13px; font-weight: 700; line-height: 1.35;">It's step 2 of your daily adventure.</span>
            <span style="min-height: 25px; margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
              <strong style="min-height: 23px; padding: 4px 9px; display: inline-flex; align-items: center; border-radius: 999px; font-size: 10.5px; font-weight: 900; background: #BFE3D8; color: #2E4B3E;">Keep going</strong>
              <small style="color: #4A5A52; font-size: 11px; font-weight: 800;">5 books read</small>
            </span>
            <span style="display: flex; gap: 7px; margin-top: 8px; flex-wrap: wrap;">
              <span style="font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 8px; background: #9F5B23; color: #fff;">Read</span>
              <span style="font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 8px; border: 1.5px solid #E9E1D4; color: #4A5A52; background: #fff;">Real books</span>
            </span>
          </button>
        </section>

        <section style="min-width: 0; padding: 14px; border: 1.5px solid #E9E1D4; border-radius: 18px; background: #FBF4EA;">
          <div style="display: grid; gap: 2px; margin: 0 2px 11px;">
            <span style="color: #9F5B23; font-size: 11px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase;">Choose another</span>
            <h2 style="margin: 0; font-size: 18px; line-height: 1.2;">Two more good choices</h2>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px;">
            <sc-for list="{{ secondary }}" as="card" hint-placeholder-count="2">
              <button type="button" style="background: #fff; border: 1.5px solid #E9E1D4; border-radius: 16px; padding: 11px 13px 12px; display: flex; flex-direction: column; align-items: stretch; text-align: left; font-family: inherit; color: inherit; cursor: pointer;">
                <span style="border-radius: 12px; height: 124px; overflow: hidden; position: relative; background: #BFE3D8;">
                  <img src="{{ card.art }}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;" />
                </span>
                <h3 style="margin: 11px 0 0; font-size: 18px; font-weight: 800; text-align: left;">{{ card.title }}</h3>
                <span style="min-height: 25px; margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                  <strong style="min-height: 23px; padding: 4px 9px; display: inline-flex; align-items: center; border-radius: 999px; font-size: 10.5px; font-weight: 900; border: 1px solid #E0C9AA; background: #FFF9EF; color: #79552E;">New</strong>
                </span>
                <span style="display: flex; gap: 7px; margin-top: 8px; flex-wrap: wrap;">
                  <span style="font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 8px; background: #9F5B23; color: #fff;">{{ card.chip }}</span>
                  <span style="font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 8px; border: 1.5px solid #E9E1D4; color: #4A5A52; background: #fff;">{{ card.line }}</span>
                </span>
                <hr style="border: 0; border-top: 1.5px solid #E9E1D4; margin: 11px 0 9px; width: 100%;" />
                <span style="display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 800;">
                  <span style="width: 26px; height: 26px; border-radius: 50%; background: #BFE3D8; display: grid; place-items: center; flex: 0 0 26px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#2E4B3E" stroke-width="1.9" stroke-linecap="round" style="width: 15px; height: 15px;"><path d="M7 5.5v13l11-6.5-11-6.5Z"></path></svg>
                  </span>
                  {{ card.foot }}
                </span>
              </button>
            </sc-for>
          </div>
        </section>
      </div>

      <details style="margin-top: 18px; border: 1.5px solid #E9E1D4; border-radius: 16px; background: #fff; overflow: clip;">
        <summary style="min-height: 58px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: pointer; list-style: none; color: #2E4B3E;">
          <span style="display: grid; gap: 1px;">
            <strong style="font-size: 15px; font-weight: 900;">More to explore</strong>
            <small style="color: #4A5A52; font-size: 12px; font-weight: 700;">4 more places</small>
          </span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" style="width: 19px; height: 19px;"><path d="M7 5.5v13l11-6.5-11-6.5Z"></path></svg>
        </summary>
        <div style="padding: 0 14px 14px; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px;">
          <sc-for list="{{ explore }}" as="card" hint-placeholder-count="4">
            <button type="button" style="background: #fff; border: 1.5px solid #E9E1D4; border-radius: 16px; padding: 11px 13px 12px; display: flex; flex-direction: column; align-items: stretch; text-align: left; font-family: inherit; color: inherit; cursor: pointer;">
              <span style="border-radius: 12px; height: 124px; overflow: hidden; position: relative; background: #BFE3D8;">
                <img src="{{ card.art }}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;" />
              </span>
              <h3 style="margin: 11px 0 0; font-size: 18px; font-weight: 800; text-align: left;">{{ card.title }}</h3>
            </button>
          </sc-for>
        </div>
      </details>
    </section>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1194,&quot;height&quot;:834}}">
class Component extends DCLogic {
  renderVals() {
    const P = {
      home: "M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z",
      sound: "M11 5 6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6",
      phonics: "M5 19V6a2 2 0 0 1 2-2h10M7 19h11M9 15h6M9 11h6",
      map: "M9 4 3 7v13l6-3 6 3 6-3V4l-6 3z M9 4v13 M15 7v13",
      book: "M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z M8 3v18",
      story: "m12 4 2 4.2 4.6.6-3.4 3.2.9 4.6L12 14.4l-4.1 2.2.9-4.6L5.4 8.8 10 8.2Z",
      arcade: "M3 8h18v9H3z M7 12h2M17 12h.01M8 11v2",
      hollow: "M4 11 12 4l8 7v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"
    };
    return {
      rail: [
        { label: "Home", d: P.home, bg: "rgba(0,0,0,0.16)" },
        { label: "Sound Seekers", d: P.sound, bg: "transparent" },
        { label: "Phonics", d: P.phonics, bg: "transparent" },
        { label: "Adventure Map", d: P.map, bg: "transparent" },
        { label: "Books", d: P.book, bg: "transparent" },
        { label: "Story Quests", d: P.story, bg: "transparent" },
        { label: "Arcade", d: P.arcade, bg: "transparent" },
        { label: "My Hollow", d: P.hollow, bg: "transparent" }
      ],
      secondary: [
        { title: "Arcade", art: "assets/home/arcade.webp", chip: "Games", line: "11 games", foot: "Jump into a game" },
        { title: "Sound Seekers", art: "assets/home/sound-seekers.webp", chip: "Adventure", line: "The Sound Trail", foot: "Walk the trail" }
      ],
      explore: [
        { title: "Phonics Learning", art: "assets/home/phonics.webp" },
        { title: "Adventure Map", art: "assets/home/adventure-map.webp" },
        { title: "Story Quests", art: "assets/home/story-quests.webp" },
        { title: "My Hollow", art: "assets/home/my-hollow.webp" }
      ]
    };
  }
}

</script>
</body>
</html>
