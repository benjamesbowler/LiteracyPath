<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Word audio chooser</title>
<style>
 body { font-family:-apple-system,"Segoe UI",sans-serif; background:#f4f8f2; margin:0; padding:28px; }
 h1 { font-size:21px; } p { max-width:70ch; color:#444; }
 .row { display:flex; align-items:center; gap:10px; margin:10px 0; flex-wrap:wrap; }
 .word { width:64px; font-size:30px; font-weight:800; color:#173F2A; }
 button { font-size:17px; font-weight:700; padding:10px 16px; border-radius:12px; border:2px solid #888;
   background:#fff; cursor:pointer; }
 button.inuse { border-color:#2C7A4B; background:#E7F5EC; }
 button:active { transform:translateY(2px); }
 .note { color:#666; font-size:13px; }
</style></head><body>
<h1>Tap every button. Each should say the word next to it, plainly, in the gold voice.</h1>
<p>The <b>green button (A)</b> is what the app now uses. If a green one is wrong but another letter on its row
sounds right, tell Claude e.g. "at should be C". If NO button on a row is right, say "ax: none".</p>
<div id="list"></div>
<script>
const DATA = {"a": [{"path": "../../public/audio/child-mode/clean-human/words/a.mp3", "tag": "IN USE", "label": "A"}, {"path": "../../public/audio/child-mode/words/a.mp3", "tag": "", "label": "B"}, {"path": "../../public/audio/child-mode/clean-human/hfw/a.mp3", "tag": "", "label": "C"}, {"path": "../../public/audio/child-mode/hfw/a.mp3", "tag": "", "label": "D"}, {"path": "../../public/guided-reading/audio/words/a.mp3", "tag": "", "label": "E"}], "am": [{"path": "../../public/audio/child-mode/clean-human/words/am.mp3", "tag": "IN USE", "label": "A"}, {"path": "../../public/audio/child-mode/words/am.mp3", "tag": "", "label": "B"}, {"path": "../../public/audio/child-mode/clean-human/hfw/am.mp3", "tag": "", "label": "C"}, {"path": "../../public/guided-reading/audio/words/am.mp3", "tag": "", "label": "D"}], "an": [{"path": "../../public/audio/child-mode/clean-human/words/an.mp3", "tag": "IN USE", "label": "A"}, {"path": "../../public/audio/child-mode/words/an.mp3", "tag": "", "label": "B"}, {"path": "../../public/audio/child-mode/clean-human/hfw/an.mp3", "tag": "", "label": "C"}, {"path": "../../public/guided-reading/audio/words/an.mp3", "tag": "", "label": "D"}], "as": [{"path": "../../public/audio/child-mode/clean-human/words/as.mp3", "tag": "IN USE", "label": "A"}, {"path": "../../public/audio/child-mode/words/as.mp3", "tag": "", "label": "B"}, {"path": "../../public/audio/child-mode/clean-human/hfw/as.mp3", "tag": "", "label": "C"}, {"path": "../../public/guided-reading/audio/words/as.mp3", "tag": "", "label": "D"}], "at": [{"path": "../../public/audio/child-mode/clean-human/words/at.mp3", "tag": "IN USE", "label": "A"}, {"path": "../../public/audio/child-mode/clean-human/hfw/at.mp3", "tag": "", "label": "B"}, {"path": "../../public/audio/child-mode/hfw/at.mp3", "tag": "", "label": "C"}, {"path": "../../public/guided-reading/audio/words/at.mp3", "tag": "", "label": "D"}], "ax": [{"path": "../../public/audio/child-mode/clean-human/words/ax.mp3", "tag": "IN USE", "label": "A"}, {"path": "../../public/audio/child-mode/words/ax.mp3", "tag": "", "label": "B"}, {"path": "../../public/media/initial-sounds/audio/a/ax.mp3", "tag": "", "label": "C"}], "i": [{"path": "../../public/audio/child-mode/clean-human/words/i.mp3", "tag": "IN USE", "label": "A"}, {"path": "../../public/audio/child-mode/words/i.mp3", "tag": "", "label": "B"}, {"path": "../../public/audio/child-mode/clean-human/hfw/i.mp3", "tag": "", "label": "C"}, {"path": "../../public/audio/child-mode/hfw/i.mp3", "tag": "", "label": "D"}, {"path": "../../public/guided-reading/audio/words/i.mp3", "tag": "", "label": "E"}], "if": [{"path": "../../public/audio/child-mode/clean-human/words/if.mp3", "tag": "IN USE", "label": "A"}, {"path": "../../public/audio/child-mode/clean-human/hfw/if.mp3", "tag": "", "label": "B"}, {"path": "../../public/guided-reading/audio/words/if.mp3", "tag": "", "label": "C"}], "in": [{"path": "../../public/audio/child-mode/clean-human/words/in.mp3", "tag": "IN USE", "label": "A"}, {"path": "../../public/audio/child-mode/clean-human/hfw/in.mp3", "tag": "", "label": "B"}, {"path": "../../public/audio/child-mode/hfw/in.mp3", "tag": "", "label": "C"}, {"path": "../../public/guided-reading/audio/words/in.mp3", "tag": "", "label": "D"}], "is": [{"path": "../../public/audio/child-mode/clean-human/words/is.mp3", "tag": "IN USE", "label": "A"}, {"path": "../../public/audio/child-mode/words/is.mp3", "tag": "", "label": "B"}, {"path": "../../public/audio/child-mode/clean-human/hfw/is.mp3", "tag": "", "label": "C"}, {"path": "../../public/audio/child-mode/hfw/is.mp3", "tag": "", "label": "D"}, {"path": "../../public/guided-reading/audio/words/is.mp3", "tag": "", "label": "E"}], "it": [{"path": "../../public/audio/child-mode/clean-human/words/it.mp3", "tag": "IN USE", "label": "A"}, {"path": "../../public/audio/child-mode/clean-human/hfw/it.mp3", "tag": "", "label": "B"}, {"path": "../../public/audio/child-mode/hfw/it.mp3", "tag": "", "label": "C"}, {"path": "../../public/guided-reading/audio/words/it.mp3", "tag": "", "label": "D"}], "of": [{"path": "../../public/audio/child-mode/clean-human/words/of.mp3", "tag": "IN USE", "label": "A"}, {"path": "../../public/audio/child-mode/words/of.mp3", "tag": "", "label": "B"}, {"path": "../../public/audio/child-mode/clean-human/hfw/of.mp3", "tag": "", "label": "C"}, {"path": "../../public/audio/child-mode/hfw/of.mp3", "tag": "", "label": "D"}, {"path": "../../public/guided-reading/audio/words/of.mp3", "tag": "", "label": "E"}], "on": [{"path": "../../public/audio/child-mode/clean-human/words/on.mp3", "tag": "IN USE", "label": "A"}, {"path": "../../public/audio/child-mode/words/on.mp3", "tag": "", "label": "B"}, {"path": "../../public/audio/child-mode/clean-human/hfw/on.mp3", "tag": "", "label": "C"}, {"path": "../../public/audio/child-mode/hfw/on.mp3", "tag": "", "label": "D"}, {"path": "../../public/guided-reading/audio/words/on.mp3", "tag": "", "label": "E"}], "up": [{"path": "../../public/audio/child-mode/clean-human/words/up.mp3", "tag": "IN USE", "label": "A"}, {"path": "../../public/audio/child-mode/words/up.mp3", "tag": "", "label": "B"}, {"path": "../../public/audio/child-mode/clean-human/hfw/up.mp3", "tag": "", "label": "C"}, {"path": "../../public/guided-reading/audio/words/up.mp3", "tag": "", "label": "D"}, {"path": "../../public/media/initial-sounds/audio/u/up.mp3", "tag": "", "label": "E"}]};
const list = document.getElementById('list');
for (const [word, opts] of Object.entries(DATA)) {
  const row = document.createElement('div'); row.className='row';
  const label = document.createElement('span'); label.className='word'; label.textContent = word; row.appendChild(label);
  for (const opt of opts) {
    const b = document.createElement('button');
    b.textContent = opt.label + (opt.tag ? ' \u2713' : '');
    if (opt.tag) b.className = 'inuse';
    b.title = opt.path;
    b.onclick = () => { new Audio(opt.path).play(); };
    row.appendChild(b);
  }
  list.appendChild(row);
}
</script>
</body></html>
