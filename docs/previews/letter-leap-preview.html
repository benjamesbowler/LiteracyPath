<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Letter Leap — LiteracyPath platformer preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#0a1020;font-family:"Fredoka",system-ui,sans-serif;color:#fff;touch-action:none;}
  #game{position:fixed;inset:0;display:block;}
  .hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:14px 18px;pointer-events:none;z-index:5;}
  .wordwrap{display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(6,12,26,.5);padding:10px 18px 12px;border-radius:18px;border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .wordwrap .lab{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;opacity:.72;}
  .word{display:flex;gap:8px;}
  .slot{width:38px;height:48px;display:grid;place-items:center;font-size:1.7rem;font-weight:700;border-radius:11px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.34);border:2px solid rgba(255,255,255,.12);}
  .slot.done{background:linear-gradient(160deg,#ffd34e,#ffab1e);color:#20140a;border-color:#ffcf4a;box-shadow:0 4px 0 #c9781a;}
  .slot.next{border-color:#ffd34e;color:#fff;box-shadow:0 0 16px rgba(255,211,77,.5);}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .hearts{font-size:1.8rem;letter-spacing:2px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));}
  .world{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85;background:rgba(6,12,26,.5);padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);}
  .pad{position:fixed;bottom:24px;z-index:6;display:flex;gap:14px;}
  .pad.left{left:24px;} .pad.right{right:24px;}
  .btn{width:76px;height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:1.8rem;font-weight:700;backdrop-filter:blur(4px);user-select:none;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.3);}
  .btn:active{background:rgba(255,255,255,.3);transform:translateY(2px);}
  .jump{background:linear-gradient(160deg,#ffd34e,#ffab1e);color:#20140a;width:96px;height:96px;font-size:1.05rem;box-shadow:0 7px 0 #c9781a;}
  .jump:active{box-shadow:0 3px 0 #c9781a;}
  .overlay{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:20;background:radial-gradient(120% 90% at 50% 25%,rgba(20,40,70,.7),rgba(6,10,22,.94));}
  .overlay.hide{display:none;}
  .panel h1{font-size:clamp(2rem,7vw,3rem);}
  .panel p{opacity:.9;margin:8px 0 22px;max-width:470px;font-size:1.05rem;line-height:1.45;}
  .cta{font-family:inherit;font-weight:700;font-size:1.3rem;color:#20140a;background:linear-gradient(160deg,#ffd34e,#ffab1e);border:0;padding:15px 34px;border-radius:999px;box-shadow:0 7px 0 #c9781a;cursor:pointer;}
  .cta:active{transform:translateY(4px);box-shadow:0 3px 0 #c9781a;}
  .badge{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;opacity:.6;display:block;margin-bottom:10px;}
  .hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:.8rem;opacity:.5;z-index:5;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="wordwrap"><span class="lab">Spell the word</span><div class="word" id="word"></div></div>
  <div class="right"><div class="hearts" id="hearts">❤❤❤</div><div class="world" id="worldName">Meadow</div></div>
</div>
<div class="pad left"><button class="btn" id="bl">◀</button><button class="btn" id="br">▶</button></div>
<div class="pad right"><button class="btn jump" id="bj">JUMP</button></div>
<div class="hint">← → move · space / JUMP to hop · stomp the grumpers</div>

<div class="overlay" id="startOverlay"><div class="panel">
  <span class="badge">LiteracyPath · platformer preview</span>
  <h1>Letter Leap</h1>
  <p>Read the word up top, then run and jump to grab its letters <b>in order</b>. Dodge the gaps and the grumpers (or bop them from above). Reach the flag to win!</p>
  <button class="cta" id="startBtn">Start level 1</button>
</div></div>
<div class="overlay hide" id="msgOverlay"><div class="panel"><h1 id="msgTitle"></h1><p id="msgText"></p><button class="cta" id="msgBtn"></button></div></div>

<script>
(function(){
  "use strict";
  const cv=document.getElementById("game"), ctx=cv.getContext("2d");
  let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);}
  addEventListener("resize",resize); resize();

  const WORLDS={
    meadow:{name:"Meadow",sky:["#7ec6ff","#a9e0ff","#dff3ff"],sun:"#fff4c2",tree:"#3f8f52",treeDark:"#2c6b3c",ground:"#5aa23f",grass:"#7fd06a",dirt:["#8a6238","#6b4a28"],words:["cat","sun","dog","hat","pig","bus","map","top","net","bed","cup","mud","jam","log","fox","hen","web","ten","pot","rug","bag","jet","lip","pin","van","wig","zip","box","cub","fan","gum","hop","kit","mat","nut","ram","sit","tap","dig","hum"]},
    dino:{name:"Dino Valley",sky:["#ffcf7a","#ffb072","#ff9d7a"],sun:"#fff0c0",tree:"#b47a3e",treeDark:"#8a5a2c",ground:"#8aa646",grass:"#b6d26a",dirt:["#7a5330","#5c3d22"],words:["ship","chip","fish","duck","frog","nest","lamp","hand","milk","jump","shop","chin","bath","moth","ring","king","sing","wing","sock","rock","lock","desk","mask","tent","gift","bump","sand","band","pond","wind","fist","best","camp","ramp","clap","flag","plum","sled","step","swim","twin","shed","much"]},
    moonwood:{name:"Moonwood",sky:["#1b2f5e","#25406e","#0e1836"],sun:"#dfe9ff",tree:"#233f66","treeDark":"#16294a",ground:"#265a4a",grass:"#3f8f74",dirt:["#1e344a","#13253a"],words:["moon","star","tree","glow","wing","leaf","song","dark","path","seed","rain","boat","coat","road","team","beam","cloud","storm","frost","dream","green","sleep","float","drift","spark","bloom","stone","flame","shine","grove","brave","charm","sweet","light","night","cake","kite","home","rope","cube"]}
  };
  let theme=WORLDS.meadow, levelIx=0, worldKey="meadow";
  // Illustrated backdrops from tools/generate-game-backgrounds.mjs (Seedream).
  // Relative path resolves when the preview is opened from the repo (docs/previews/).
  const BGIMG={};
  ["meadow","dino","moonwood"].forEach(k=>{const im=new Image();im.onload=()=>{BGIMG[k]=im;};im.src="../../public/images/games/bg-"+k+".webp";});
  // Character / enemy / tile sprites (Seedream, transparent). Drawn shapes are the fallback.
  const SPR={};
  const sprLoad=(k,f)=>{const im=new Image();im.onload=()=>{SPR[k]=im;};im.src="../../public/images/games/"+f;};
  sprLoad("char","char-hero.webp");sprLoad("grumper","enemy-grumper.webp");sprLoad("ground","tile-ground.webp");sprLoad("platform","tile-platform.webp");

  const GRAV=0.62, MOVE=4.2, JUMP=13.6, GROUND_H=96, REACH=110;
  // Tune stage length here: a stage = WORDS_PER_LEVEL words spelled in one long run.
  const WORDS_PER_LEVEL=8, SEG=780, WORD_GAP=680, MAXH=5;
  let player, level, words, wIx, word, nextIx, hearts, running=false, cam=0, last=0, invuln=0, particles=[], spores=[];
  function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  // No-repeat word deck: draw words until the whole world bank is used, then reshuffle.
  let deck=[];
  function drawWords(n){ if(deck.length<n) deck=deck.concat(shuffle(theme.words.map(w=>w.toUpperCase()))); return deck.splice(0,n); }
  const keys={left:false,right:false,jump:false};
  function groundY(){return H-GROUND_H;}

  function makeLevel(levelWords){
    // A stage = several words spelled in one long run. Letters are laid out left
    // to right across the whole stage; each is always reachable (ground, or a low
    // platform placed under it). Difficulty stays flat - the stage is just longer.
    const plats=[], bubbles=[], blocks=[], pickups=[], letterX=[];
    let cx=380;
    levelWords.forEach((up,wi)=>{
      for(let i=0;i<up.length;i++){
        // Required letters ALWAYS sit on the ground, in order, so the run collects
        // them naturally and a word can never become uncompletable.
        bubbles.push({x:cx,y:groundY()-46,ch:up[i],word:wi,order:i,taken:false});
        letterX.push(cx); cx+=SEG;
      }
      if(wi<levelWords.length-1){ plats.push({x:cx-WORD_GAP*0.5-60,y:groundY()-104,w:120}); cx+=WORD_GAP; }
    });
    const L=cx+340, flag=cx+180;
    const near=(x,pad)=>letterX.some(lx=>Math.abs(lx-x)<pad);
    // more (still jumpable) pits in the gaps
    const pits=[];
    for(let gx=740;gx<flag-440;gx+=SEG*1.3){ if(!near(gx,120)&&Math.random()<0.7)pits.push([gx-48,gx+48]); }
    const inPitX=x=>pits.some(p=>x>p[0]-42&&x<p[1]+42);
    // climbable "hills" - ascending step platforms, often with a heart at the top
    for(let sx=1050;sx<flag-760;sx+=SEG*2.2){
      if(near(sx,150)||inPitX(sx)||Math.random()>=0.6)continue;
      const steps=2+Math.floor(Math.random()*3);
      for(let k=0;k<steps;k++)plats.push({x:sx+k*72,y:groundY()-70-k*48,w:66});
      if(Math.random()<0.6)pickups.push({x:sx+(steps-1)*72+33,y:groundY()-108-(steps-1)*48,taken:false});
    }
    // smashable brick + prize(?) blocks, floating at bump height, in clusters
    for(let bx=620;bx<flag-340;bx+=SEG*0.8){
      if(near(bx,120)||inPitX(bx)||Math.random()>=0.55)continue;
      const n=1+Math.floor(Math.random()*3);
      for(let k=0;k<n;k++){const type=Math.random()<0.3?"prize":"brick";blocks.push({x:bx+k*46,y:groundY()-140,w:44,h:40,type,broken:false,used:false});}
    }
    // free-floating heart pickups (top up a life)
    for(let hx=1300;hx<flag-520;hx+=SEG*3.6){ if(!near(hx,120)&&!inPitX(hx))pickups.push({x:hx,y:groundY()-150,taken:false}); }
    // LOTS more grumpers - dodge or stomp; never on a letter or a pit
    const foes=[];
    for(let fx=760;fx<flag-420;fx+=SEG*0.95){ const c=fx+Math.random()*130; if(!near(c,108)&&!inPitX(c)&&Math.random()<0.8)foes.push({x0:c-66,x1:c+66,x:c,dir:1,y:groundY()-28}); }
    // MORE decoy (wrong) letters, ELEVATED so you pass under them - hitting one costs a heart
    const decoyPool="BDFGJKMPQVXZ".split("");
    for(let dx=940;dx<flag-420;dx+=SEG*1.15){ if(!near(dx,120)&&!inPitX(dx)&&Math.random()<0.72)bubbles.push({x:dx,y:groundY()-122,ch:decoyPool[Math.floor(Math.random()*decoyPool.length)],word:-1,order:-1,taken:false}); }
    return {L,pits,plats,blocks,pickups,bubbles,foes,flag};
  }
  function inPit(x){return level.pits.some(p=>x>p[0]&&x<p[1]);}

  function startLevel(){
    words=drawWords(WORDS_PER_LEVEL); wIx=0; word=words[0]; nextIx=0;
    level=makeLevel(words);
    player={x:70,y:groundY()-46,w:32,h:46,vx:0,vy:0,onGround:true,face:1,anim:0,spawnX:70,squash:0};
    hearts=3; cam=0; invuln=0; particles=[]; running=true;
    spores=[]; for(let i=0;i<28;i++)spores.push({x:Math.random()*2400,y:Math.random()*H,s:1+Math.random()*2.5,ph:Math.random()*6});
    renderWord(); updateHearts();
    document.getElementById("worldName").textContent=theme.name+" · Lvl "+(levelIx+1);
  }
  function renderWord(){const el=document.getElementById("word");el.innerHTML="";for(let i=0;i<word.length;i++){const s=document.createElement("div");s.className="slot"+(i<nextIx?" done":i===nextIx?" next":"");s.textContent=word[i];el.appendChild(s);}const lab=document.querySelector(".wordwrap .lab");if(lab)lab.textContent="Word "+(wIx+1)+" of "+words.length+" · spell it";}
  function updateHearts(){document.getElementById("hearts").textContent="❤".repeat(hearts)+"♡".repeat(Math.max(0,3-hearts));}

  function beep(f,t,d,v){try{const A=beep.c||(beep.c=new(window.AudioContext||window.webkitAudioContext)());const o=A.createOscillator(),g=A.createGain();o.type=t||"sine";o.frequency.value=f;o.connect(g);g.connect(A.destination);g.gain.setValueAtTime(v||.15,A.currentTime);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+(d||.15));o.start();o.stop(A.currentTime+(d||.15));}catch(e){}}
  const sGood=()=>{beep(660,"triangle",.1,.16);setTimeout(()=>beep(990,"triangle",.14,.14),70);};
  const sBad=()=>beep(150,"sawtooth",.18,.13);
  const sJump=()=>beep(430,"square",.08,.09);
  const sBlock=()=>{beep(190,"square",.09,.13);setTimeout(()=>beep(120,"square",.08,.1),40);};
  const sHeart=()=>{beep(880,"sine",.1,.14);setTimeout(()=>beep(1320,"sine",.14,.13),80);};
  const sWin=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,"triangle",.2,.15),i*120));
  function burst(x,y,c){for(let i=0;i<14;i++)particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.7)*6,life:.6,c});}

  function hurt(){if(invuln>0)return;hearts--;updateHearts();sBad();invuln=1.3;burst(player.x,player.y,"#ff7a66");
    if(hearts<=0){running=false;msg("Oh no!","The grumpers got you. Try again — you can do it!","Retry",()=>startLevel());}
    else{player.x=player.spawnX;player.y=groundY()-46;player.vx=0;player.vy=0;cam=Math.max(0,player.x-W*0.35);}}
  function wordDone(){
    burst(player.x,player.y-16,"#7cf0b6");beep(784,"triangle",.14,.14);
    if(wIx<words.length-1){wIx++;word=words[wIx];nextIx=0;setTimeout(()=>beep(1046,"triangle",.16,.14),90);}
    renderWord();
  }
  function winLevel(){running=false;sWin();levelIx++;
    msg("Stage complete! 🌟","You spelled all "+words.length+" words in the "+theme.name+"!","Next stage",()=>startLevel());}
  function msg(t,x,b,fn){const o=document.getElementById("msgOverlay");document.getElementById("msgTitle").textContent=t;document.getElementById("msgText").textContent=x;const btn=document.getElementById("msgBtn");btn.textContent=b;btn.onclick=()=>{o.classList.add("hide");fn();};o.classList.remove("hide");}

  addEventListener("keydown",e=>{if(e.key==="ArrowLeft")keys.left=true;else if(e.key==="ArrowRight")keys.right=true;else if(e.key===" "||e.key==="ArrowUp"){keys.jump=true;e.preventDefault();}});
  addEventListener("keyup",e=>{if(e.key==="ArrowLeft")keys.left=false;else if(e.key==="ArrowRight")keys.right=false;else if(e.key===" "||e.key==="ArrowUp")keys.jump=false;});
  const hold=(id,k)=>{const el=document.getElementById(id);el.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true;});el.addEventListener("pointerup",()=>keys[k]=false);el.addEventListener("pointerleave",()=>keys[k]=false);};
  hold("bl","left");hold("br","right");hold("bj","jump");
  document.getElementById("startBtn").onclick=()=>{document.getElementById("startOverlay").classList.add("hide");startLevel();};

  function update(dt){
    if(!running)return;
    if(invuln>0)invuln-=dt;
    const p=player;
    p.vx=(keys.right?MOVE:0)-(keys.left?MOVE:0);
    if(keys.jump&&p.onGround){p.vy=-JUMP;p.onGround=false;p.squash=-0.3;sJump();}
    p.vy+=GRAV; if(p.vy>18)p.vy=18;
    p.x+=p.vx; if(p.vx)p.face=p.vx>0?1:-1; p.anim+=Math.abs(p.vx)*0.07;
    p.y+=p.vy;
    const wasAir=!p.onGround; p.onGround=false;
    const feet=p.y+p.h/2;
    for(const pl of level.plats){if(p.x+p.w/2>pl.x&&p.x-p.w/2<pl.x+pl.w&&p.vy>=0&&feet>=pl.y&&feet<=pl.y+24){p.y=pl.y-p.h/2;p.vy=0;p.onGround=true;p.spawnX=p.x;}}
    for(const bl of level.blocks){if(bl.broken)continue;const ox=p.x+p.w/2>bl.x+4&&p.x-p.w/2<bl.x+bl.w-4;const head=p.y-p.h/2;
      if(ox&&p.vy>=0&&feet>=bl.y&&feet<=bl.y+22){p.y=bl.y-p.h/2;p.vy=0;p.onGround=true;}
      else if(ox&&p.vy<0&&head<=bl.y+bl.h&&head>=bl.y+bl.h-22){p.vy=1.5;
        if(bl.type==="brick"){bl.broken=true;sBlock();burstBlock(bl);}
        else if(bl.type==="prize"&&!bl.used){bl.used=true;sHeart();level.pickups.push({x:bl.x+bl.w/2,y:bl.y-16,taken:false});}}}
    if(feet>=groundY()){if(inPit(p.x)){if(p.y>H+40)hurt();}else{p.y=groundY()-p.h/2;p.vy=0;p.onGround=true;if(p.x>70)p.spawnX=Math.max(p.spawnX,p.x-24);}}
    if(p.onGround&&wasAir)p.squash=0.35;
    p.squash*=0.8;
    if(p.x<18)p.x=18;
    for(const b of level.bubbles){if(b.taken)continue;
      if(Math.abs(b.x-p.x)<34&&Math.abs(b.y-p.y)<42){
        if(b.word===-1){b.taken=true;burst(b.x,b.y,"#ff7a66");hurt();}
        else if(b.word===wIx&&b.order===nextIx){b.taken=true;nextIx++;sGood();burst(b.x,b.y,"#ffd34e");
          if(nextIx>=word.length)wordDone();else renderWord();}
      }
    }
    for(const hp of level.pickups){if(hp.taken)continue;if(Math.abs(hp.x-p.x)<28&&Math.abs(hp.y-p.y)<32){hp.taken=true;hearts=Math.min(MAXH,hearts+1);updateHearts();sHeart();burst(hp.x,hp.y,"#ff6b8a");}}
    for(const f of level.foes){f.x+=f.dir*1.5;if(f.x<f.x0||f.x>f.x1)f.dir*=-1;
      if(Math.abs(f.x-p.x)<28&&Math.abs(f.y-p.y)<34){if(p.vy>2&&p.y<f.y-6){f.dead=true;p.vy=-9;sGood();burst(f.x,f.y,"#a0ffb0");}else hurt();}}
    level.foes=level.foes.filter(f=>!f.dead);
    const stageDone=(wIx>=words.length-1)&&(nextIx>=word.length);
    if(p.x>level.flag&&stageDone)winLevel();
    else if(p.x>level.flag&&!stageDone)p.x=level.flag-4;
    cam=Math.max(0,Math.min(level.L-W,p.x-W*0.35));
    for(const pt of particles){pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.3;pt.life-=dt;}
    particles=particles.filter(pt=>pt.life>0);
  }

  function drawBgImage(){
    const im=BGIMG[worldKey];
    if(!im||!im.width)return false;
    const scale=H/im.height, iw=im.width*scale;
    // Mirror every other copy so the repeat edges match exactly - no visible seam.
    const shift=cam*0.35;
    for(let i=Math.floor(shift/iw)-1;i*iw-shift<W+iw;i++){
      const x=i*iw-shift;
      ctx.save();
      if((((i%2)+2)%2)===1){ ctx.translate(x+iw,0); ctx.scale(-1,1); ctx.drawImage(im,0,0,iw,H); }
      else ctx.drawImage(im,x,0,iw,H);
      ctx.restore();
    }
    // gentle darken at the base so gameplay tiles read clearly on top
    const sh=ctx.createLinearGradient(0,H-GROUND_H-70,0,H-GROUND_H);sh.addColorStop(0,"rgba(6,10,20,0)");sh.addColorStop(1,"rgba(6,10,20,.28)");ctx.fillStyle=sh;ctx.fillRect(0,H-GROUND_H-70,W,70);
    return true;
  }
  function draw(){
    const t=Date.now()*0.001;
    // Illustrated Seedream backdrop if generated, else drawn parallax.
    if(!drawBgImage()){
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,theme.sky[0]);g.addColorStop(.55,theme.sky[1]);g.addColorStop(1,theme.sky[2]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      const gx=W*0.8,gy=H*0.2;const cg=ctx.createRadialGradient(gx,gy,10,gx,gy,180);cg.addColorStop(0,theme.sun);cg.addColorStop(1,"rgba(255,255,255,0)");ctx.fillStyle=cg;ctx.fillRect(0,0,W,H);
      treeRow(theme.treeDark,0.2,H-GROUND_H+6,150,90,0.28);
      treeRow(theme.tree,0.45,H-GROUND_H+14,220,140,0.6);
    }
    // spores
    for(const s of spores){const sx=((s.x-cam*0.5)%(W+60)+W+60)%(W+60)-30;const sy=s.y+Math.sin(t*0.8+s.ph)*14;ctx.globalAlpha=0.5;ctx.fillStyle=theme===WORLDS.moonwood?"#ffe9a0":"#ffffff";ctx.beginPath();ctx.arc(sx,sy,s.s,0,7);ctx.fill();ctx.globalAlpha=1;}

    ctx.save();ctx.translate(-cam,0);
    // ground: a clean drawn grass + dirt band (reliable - AI ground tiles gave white margins)
    let x=0;
    const dg=ctx.createLinearGradient(0,groundY(),0,H);dg.addColorStop(0,theme.dirt[0]);dg.addColorStop(1,theme.dirt[1]);ctx.fillStyle=dg;ctx.fillRect(0,groundY()+16,level.L,GROUND_H);
    for(const p of level.pits){grassStrip(x,p[0]-x);x=p[1];}grassStrip(x,level.L-x);
    ctx.fillStyle="rgba(0,0,0,.12)";for(let dx=0;dx<level.L;dx+=46){ctx.beginPath();ctx.arc(dx% level.L,groundY()+46+((dx/46|0)%2)*20,3,0,7);ctx.fill();}
    // platforms
    for(const pl of level.plats){platform(pl);}
    // smashable / prize blocks + heart pickups
    for(const bl of level.blocks)drawBlock(bl);
    for(const hp of level.pickups){if(!hp.taken)drawHeart(hp.x,hp.y+Math.sin(t*3+hp.x)*4);}
    // flag
    ctx.strokeStyle="#f2f2f2";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(level.flag,groundY());ctx.lineTo(level.flag,groundY()-130);ctx.stroke();
    ctx.fillStyle="#ffd34e";ctx.beginPath();ctx.moveTo(level.flag,groundY()-130);ctx.lineTo(level.flag+44,groundY()-112);ctx.lineTo(level.flag,groundY()-94);ctx.closePath();ctx.fill();
    // bubbles
    for(const b of level.bubbles){if(b.taken)continue;const bob=Math.sin(t*2.4+b.x)*4;bubble(b.x,b.y+bob,b.ch,b.order===-1);}
    // grumpers
    for(const f of level.foes)grumper(f);
    drawPlayer();
    for(const pt of particles){ctx.globalAlpha=Math.max(0,pt.life/0.6);ctx.fillStyle=pt.c;ctx.beginPath();ctx.arc(pt.x,pt.y,3.5,0,7);ctx.fill();ctx.globalAlpha=1;}
    ctx.restore();
    // vignette
    const vg=ctx.createRadialGradient(W/2,H/2,H*0.4,W/2,H/2,H*0.85);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.28)");ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  }
  function treeRow(col,par,base,spacing,ht,alpha){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=col;const off=-cam*par;for(let i=-1;i<W/spacing+2;i++){const px=i*spacing+((off%spacing)+spacing)%spacing;
    ctx.fillRect(px-6,base-ht*0.5,12,ht*0.5); // trunk
    ctx.beginPath();ctx.arc(px,base-ht*0.55,ht*0.34,0,7);ctx.arc(px-ht*0.28,base-ht*0.4,ht*0.26,0,7);ctx.arc(px+ht*0.28,base-ht*0.4,ht*0.26,0,7);ctx.fill();}
    ctx.restore();}
  function grassStrip(x,w){if(w<=0)return;ctx.fillStyle=theme.ground;ctx.fillRect(x,groundY(),w,20);ctx.fillStyle=theme.grass;ctx.beginPath();ctx.moveTo(x,groundY()+4);for(let gx=x;gx<=x+w;gx+=14){ctx.lineTo(gx,groundY()-3);ctx.lineTo(gx+7,groundY()+3);}ctx.lineTo(x+w,groundY()+8);ctx.lineTo(x,groundY()+8);ctx.closePath();ctx.fill();}
  function platform(pl){ctx.fillStyle="rgba(0,0,0,.22)";rr(pl.x+4,pl.y+8,pl.w,22,10);ctx.fill();const im=SPR.platform;if(im&&im.width){ctx.save();rr(pl.x,pl.y,pl.w,28,10);ctx.clip();const th=46,tw=im.width/im.height*th;for(let gx=pl.x;gx<pl.x+pl.w;gx+=tw)ctx.drawImage(im,gx,pl.y-6,tw,th);ctx.restore();return;}const dg=ctx.createLinearGradient(0,pl.y,0,pl.y+24);dg.addColorStop(0,theme.grass);dg.addColorStop(.3,theme.ground);dg.addColorStop(1,theme.dirt[0]);ctx.fillStyle=dg;rr(pl.x,pl.y,pl.w,24,10);ctx.fill();ctx.fillStyle="rgba(255,255,255,.18)";rr(pl.x+5,pl.y+3,pl.w-10,4,2);ctx.fill();}
  function bubble(x,y,ch){ctx.save();ctx.shadowColor="rgba(95,224,160,.7)";ctx.shadowBlur=18;const rg=ctx.createRadialGradient(x-6,y-6,3,x,y,22);rg.addColorStop(0,"#e8fff2");rg.addColorStop(1,"#3fc98a");ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,21,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="rgba(255,255,255,.5)";ctx.beginPath();ctx.arc(x-6,y-7,5,0,7);ctx.fill();ctx.fillStyle="#0a1a12";ctx.font="700 23px Fredoka, sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(ch,x,y+1);ctx.restore();}
  function grumper(f){ctx.save();ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(f.x,f.y+16,18,5,0,0,7);ctx.fill();const gim=SPR.grumper;if(gim&&gim.width){const h=48,w=gim.width/gim.height*h;ctx.translate(f.x,f.y);ctx.scale(-f.dir,1);ctx.drawImage(gim,-w/2,-h/2-4,w,h);ctx.restore();return;}const gg=ctx.createLinearGradient(0,f.y-18,0,f.y+14);gg.addColorStop(0,"#ff6b57");gg.addColorStop(1,"#c9331f");ctx.fillStyle=gg;rr(f.x-16,f.y-16,32,30,10);ctx.fill();ctx.fillStyle="#7a1a0e";for(let s=-12;s<=12;s+=6){ctx.beginPath();ctx.moveTo(f.x+s,f.y-16);ctx.lineTo(f.x+s+3,f.y-24);ctx.lineTo(f.x+s+6,f.y-16);ctx.fill();}ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(f.x-6,f.y-4,4.5,0,7);ctx.arc(f.x+6,f.y-4,4.5,0,7);ctx.fill();ctx.fillStyle="#0a1a12";ctx.beginPath();ctx.arc(f.x-6+f.dir*2,f.y-4,2.2,0,7);ctx.arc(f.x+6+f.dir*2,f.y-4,2.2,0,7);ctx.fill();ctx.restore();}
  function drawPlayer(){const p=player;if(invuln>0&&Math.floor(invuln*12)%2===0)return;const sq=p.squash;const sx=1-sq,sy=1+sq;const bob=p.onGround?Math.sin(p.anim)*1.5:0;
    ctx.save();
    // shadow
    ctx.fillStyle="rgba(0,0,0,.28)";ctx.beginPath();ctx.ellipse(p.x,groundY()-2>p.y+22?p.y+24:groundY()-2,16,5,0,0,7);ctx.fill();
    ctx.translate(p.x,p.y+bob);ctx.scale(p.face*sx,sy);
    const cim=SPR.char;
    if(cim&&cim.width){const h=66,w=cim.width/cim.height*h;ctx.drawImage(cim,-w/2,-h/2-6,w,h);ctx.restore();return;}
    const lk=p.onGround?Math.sin(p.anim)*5:5;ctx.fillStyle="#2f7a4b";rr(-10,12,8,11+lk,3);ctx.fill();rr(2,12,8,11-lk,3);ctx.fill();
    const bg=ctx.createLinearGradient(0,-18,0,16);bg.addColorStop(0,"#7cf0b6");bg.addColorStop(1,"#34c589");ctx.fillStyle=bg;rr(-15,-18,30,34,13);ctx.fill();ctx.strokeStyle="#0f6b48";ctx.lineWidth=2;rr(-15,-18,30,34,13);ctx.stroke();
    ctx.fillStyle="#d6fbe8";rr(-9,-2,18,14,8);ctx.fill();
    ctx.fillStyle="#0a1a12";ctx.beginPath();ctx.arc(-4,-8,3.2,0,7);ctx.arc(7,-8,3.2,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-3,-9,1.1,0,7);ctx.arc(8,-9,1.1,0,7);ctx.fill();
    ctx.fillStyle="#2fae74";ctx.beginPath();ctx.moveTo(0,-18);ctx.quadraticCurveTo(9,-27,15,-22);ctx.quadraticCurveTo(6,-16,0,-18);ctx.fill();
    ctx.restore();}
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  function drawBlock(bl){if(bl.broken)return;const x=bl.x,y=bl.y,w=bl.w,h=bl.h;
    if(bl.type==="prize"){ctx.fillStyle=bl.used?"#8a7a3a":"#ffcf4a";rr(x,y,w,h,7);ctx.fill();ctx.strokeStyle="#7a5a10";ctx.lineWidth=3;rr(x,y,w,h,7);ctx.stroke();
      ctx.fillStyle="#7a5a10";[[6,6],[w-6,6],[6,h-6],[w-6,h-6]].forEach(d=>{ctx.beginPath();ctx.arc(x+d[0],y+d[1],2.2,0,7);ctx.fill();});
      ctx.fillStyle=bl.used?"#6a5a2a":"#7a5a10";ctx.font="700 24px Fredoka,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("?",x+w/2,y+h/2+1);
    } else {ctx.fillStyle="#b5602f";rr(x,y,w,h,5);ctx.fill();ctx.strokeStyle="#7a3d18";ctx.lineWidth=3;rr(x,y,w,h,5);ctx.stroke();
      ctx.strokeStyle="rgba(0,0,0,.22)";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y+h/2);ctx.lineTo(x+w,y+h/2);ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h/2);ctx.moveTo(x+w*0.25,y+h/2);ctx.lineTo(x+w*0.25,y+h);ctx.moveTo(x+w*0.75,y+h/2);ctx.lineTo(x+w*0.75,y+h);ctx.stroke();}}
  function drawHeart(x,y){ctx.save();ctx.shadowColor="rgba(255,90,120,.7)";ctx.shadowBlur=14;ctx.fillStyle="#ff5a78";const s=13;ctx.beginPath();ctx.moveTo(x,y+s*0.7);ctx.bezierCurveTo(x-s,y-s*0.4,x-s*0.5,y-s,x,y-s*0.35);ctx.bezierCurveTo(x+s*0.5,y-s,x+s,y-s*0.4,x,y+s*0.7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="rgba(255,255,255,.55)";ctx.beginPath();ctx.arc(x-3,y-4,2.5,0,7);ctx.fill();ctx.restore();}
  function burstBlock(bl){for(let i=0;i<10;i++)particles.push({x:bl.x+bl.w/2,y:bl.y+bl.h/2,vx:(Math.random()-.5)*7,vy:-Math.random()*6-1,life:.7,c:"#b5602f"});}
  function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.05,((now-last)||16)/1000);last=now;update(dt);draw();}
  requestAnimationFrame(loop);
})();
</script>
