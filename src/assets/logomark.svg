<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 84" fill="none" aria-label="Literacy Guide">
  <!-- Light rays -->
  <line x1="34" y1="20" x2="6"  y2="5"  stroke="#d68a11" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34" y1="20" x2="62" y2="5"  stroke="#d68a11" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34" y1="20" x2="34" y2="2"  stroke="#d68a11" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="34" y1="20" x2="2"  y2="20" stroke="#d68a11" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
  <line x1="34" y1="20" x2="66" y2="20" stroke="#d68a11" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
  <!-- Lantern glow ring -->
  <circle cx="34" cy="20" r="6" fill="none" stroke="#d68a11" stroke-width="2"/>
  <!-- Lantern dot -->
  <circle cx="34" cy="20" r="2.5" fill="#d68a11"/>
  <!-- Lantern cap triangle -->
  <path d="M24 20 L34 11 L44 20" fill="none" stroke="#4f63d7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Lantern room -->
  <rect x="26" y="20" width="16" height="6" rx="1.5" fill="none" stroke="#4f63d7" stroke-width="1.8"/>
  <!-- Tower body -->
  <path d="M27 26 L24 66 L44 66 L41 26 Z" fill="none" stroke="#172033" stroke-width="2" stroke-linejoin="round"/>
  <!-- Horizontal stripe details -->
  <line x1="24.6" y1="38" x2="43.4" y2="38" stroke="#172033" stroke-width="1.2" opacity="0.3"/>
  <line x1="24.2" y1="50" x2="43.8" y2="50" stroke="#172033" stroke-width="1.2" opacity="0.3"/>
  <!-- Door arch -->
  <path d="M30 66 L30 58 Q34 53 38 58 L38 66" fill="none" stroke="#172033" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Base platform -->
  <line x1="19" y1="66" x2="49" y2="66" stroke="#172033" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Teal waves -->
  <path d="M6 74 Q14 70 22 74 Q30 78 38 74 Q46 70 54 74 Q60 77 66 75" stroke="#159a8a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M2 82 Q12 78 22 82 Q32 86 42 82 Q52 78 66 82" stroke="#159a8a" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.4"/>
