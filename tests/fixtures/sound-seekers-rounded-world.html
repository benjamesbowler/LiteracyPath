<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rounded campaign world verification</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#253c34;color:#fff}header,footer{display:flex;gap:8px;align-items:center;padding:8px;flex-wrap:wrap}button,select,label{font:inherit;min-height:48px;padding:10px;border-radius:10px}button,select{background:#fff8e5;color:#253c34;border:0}label{display:flex;gap:8px;align-items:center}#world{position:relative;width:100%;height:calc(100dvh - 190px);min-height:350px}canvas{display:block;outline-offset:-4px}p{margin:8px}output{padding:8px;display:block}button:focus-visible,select:focus-visible{outline:4px solid #e7b665;outline-offset:2px}</style></head><body><header><label for="place">Place</label><select id="place"></select><button id="explore">Explore</button><button id="before">Before repair</button><button id="part">One main part</button><button id="full">Finished repair</button><label><input id="low" type="checkbox">Low power</label><label><input id="reduced" type="checkbox" checked>Reduced motion</label></header><main id="world"></main><footer><button id="mission">Walk to first encounter</button><button id="carry">Walk to carry object</button><button id="operate">Walk to lookout</button><button id="use">Use nearby object</button><button id="pause">Pause</button></footer><output id="status" role="status">Opening the landscape…</output><p>Scenery and traversal verification. Repair buttons render canonical receipt states; this fixture submits no reading evidence.</p><script type="module">
import {createCampaignWorld} from '/src/features/soundSeekers/rounded/campaignWorld.js';
import {CAMPAIGN_STAGES} from '/src/features/soundSeekers/v3/content/campaign.js';
import {woodlandAssetUrl} from '/demos/sound-seekers/src/assetUrls.js';
const el=id=>document.getElementById(id),host=el('world'),status=el('status'),select=el('place');
for(const s of CAMPAIGN_STAGES){const option=document.createElement('option');option.value=s.id;option.textContent=`${s.number}. ${s.name}`;select.append(option);}
const params=new URLSearchParams(location.search);select.value=params.get('stage')||'meadow-01';el('low').checked=params.get('low')==='1';
let world=null,controller=null,generation=0,paused=true,phase='title',count=0,discoveredIds=[],carryingId=null,stage=CAMPAIGN_STAGES.find(s=>s.id===select.value);
function update(){world?.setState({phase,paused,reduced:el('reduced').checked,low:el('low').checked,completedMissionIds:stage.missionIds.slice(0,count),availableMissionIds:[...stage.missionIds,...stage.optionalMissionIds],focusMissionId:stage.missionIds[0],discoveredIds,carryingId});host.dataset.completedParts=String(count);host.dataset.discovered=discoveredIds.join(',');host.dataset.carrying=carryingId||'';}
function show(value){host.dataset.x=String(value.x);host.dataset.z=String(value.z);host.dataset.nearMission=value.nearMissionId||'';host.dataset.interaction=value.worldInteraction?.action||'';host.dataset.frames=String(value.renderedFrames);host.dataset.calls=String(value.drawCalls);host.dataset.triangles=String(value.triangles);status.textContent=`${stage.name}: ${value.worldInteraction?.prompt||value.carrying?.title||'Explore the branches.'} · ${value.drawCalls} calls · ${value.triangles} triangles · ${value.frameMs.toFixed(1)} ms`;}
async function open(){const token=++generation;controller?.abort();world?.dispose();world=null;controller=new AbortController();stage=CAMPAIGN_STAGES.find(s=>s.id===select.value);status.textContent='Opening the landscape…';host.dataset.ready='false';host.dataset.failure='';paused=true;phase='title';count=0;discoveredIds=[];carryingId=null;try{const made=await createCampaignWorld(host,{ready(){host.dataset.ready='true';},failure(error){status.textContent=error.message;host.dataset.failure=error.message;},snapshot(value){if(token===generation)show(value);},interaction(event){if(event.action==='pickup')carryingId=event.id;if(event.action==='place')carryingId=null;update();},discovery(event){discoveredIds=[...new Set([...discoveredIds,event.id])];update();}},{stageId:stage.id,assetUrl:path=>woodlandAssetUrl(`/assets/${path}`),reduced:el('reduced').checked,low:el('low').checked,signal:controller.signal});if(token!==generation){made.dispose();return;}world=made;update();}catch(error){status.textContent=error.message;host.dataset.failure=error.message;}}
select.addEventListener('change',open);el('explore').onclick=()=>{phase='explore';paused=false;update();};el('before').onclick=()=>{count=0;update();};el('part').onclick=()=>{count=1;update();};el('full').onclick=()=>{count=5;update();};el('low').onchange=update;el('reduced').onchange=update;el('mission').onclick=()=>world?.walkToMission(stage.missionIds[0]);el('carry').onclick=()=>world?.walkToDiscovery('carry');el('operate').onclick=()=>world?.walkToDiscovery('operate');el('use').onclick=()=>world?.interact();el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'Resume':'Pause';update();};
const keys=new Set();function move(){world?.move(Number(keys.has('ArrowRight')||keys.has('d'))-Number(keys.has('ArrowLeft')||keys.has('a')),Number(keys.has('ArrowDown')||keys.has('s'))-Number(keys.has('ArrowUp')||keys.has('w')));world?.run(keys.has('Shift'));}addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','Shift'].includes(e.key)){e.preventDefault();keys.add(e.key);move();}else if(e.key==='e')world?.interact();});addEventListener('keyup',e=>{keys.delete(e.key);move();});addEventListener('blur',()=>{keys.clear();move();});addEventListener('pagehide',()=>{controller?.abort();world?.dispose();});open();
</script></body></html>
