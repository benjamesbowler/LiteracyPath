<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Literacy Guide</title>
  </head>
  <body>
    <div id="root">
      <style>
        .lp-static-splash{min-height:100vh;display:grid;place-items:center;background:#F1F5F9;color:#0F172A;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
        .lp-static-splash-card{display:grid;gap:12px;justify-items:center;border:1px solid #E2E8F0;border-radius:8px;background:#fff;padding:24px 28px;box-shadow:0 1px 4px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06)}
        .lp-static-splash-mark{width:36px;height:36px;border-radius:8px;background:#0C6B65}
        .lp-static-splash-spinner{width:28px;height:28px;border:3px solid #E2E8F0;border-top-color:#0C6B65;border-radius:50%;animation:lpSplashSpin .8s linear infinite}
        .lp-static-splash-card strong{font-size:1rem}
        @keyframes lpSplashSpin{to{transform:rotate(360deg)}}
        @media (prefers-reduced-motion:reduce){.lp-static-splash-spinner{animation:none}}
      </style>
      <div class="lp-static-splash" role="status" aria-live="polite">
        <div class="lp-static-splash-card">
          <div class="lp-static-splash-mark" aria-hidden="true"></div>
          <strong>Literacy Guide</strong>
          <div class="lp-static-splash-spinner" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
